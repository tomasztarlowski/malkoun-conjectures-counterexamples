version: "v0.4"

project:
  name: "Counterexamples to All Four Malkoun Conjectures (A–D), Planar Tree Zeros, and Unconditional Path Positivity"
  description: >-
    Lean 4 and Mathlib formalization resolving all four main conjectures (A, B, C, D) and the
    Section 6 real-positivity question from Joseph Malkoun's preprint "Finite graphs and
    configurations of points" (arXiv:2508.13472v3), alongside unconditional positive theorems for
    linear paths LG_n and small trees. Using strictly propext, Quot.sound, and Classical.choice
    (zero sorry, zero admit, zero native_decide), the repository formalizes: (1) a bipartite
    quaternionic time-reversal Gram reduction extending Malkoun's Theorem 4.1 to all finite simple
    bipartite graphs (MalkounBipartite); (2) formal planar homotopy disproofs of Conjectures A, B,
    and Section 6 on the connected K_4-barbell B_8 (MalkounCounterexample), the minimal n=7
    2-vertex-connected planar graph H_7 = K_4 ∪_{2e} K_3 (MalkounN7Counterexample), and the
    triangle-free 3-regular 3-vertex-connected Wagner graph M_8 (MalkounWagnerCounterexample);
    (3) refutations of General Conjecture D at m=6 (rank-3 matrix on C_6) and Rank-2 Spinor
    Conjecture D at m=12 (2x12 Gaussian-integer witness on C_{12}) alongside unconditional
    Conjecture C for LG_3, LG_4, K_{1,3}, and LG_5 (MalkounConjectureD); (4) an exact planar
    120-degree pinwheel zero A_{T_{10}}(x) = 0 on the 10-vertex cubic cherry tree T_{10} refuting
    Conjecture C, tree-restricted Conjecture D, and tree Conjectures A and B simultaneously, plus
    exact integer Hopf coordinates on LG_{15} giving Re(A_{LG_{15}}) < 0 (MalkounConjectureC);
    and (5) unconditional Path Conjectures B and A (|A_{LG_n}(x)| >= 1 for all n and x in
    C_{LG_n}(R^3)) via an exact hyperbolic SU(2) Lyapunov transfer invariant, together with
    unconditional Planar Path Conjecture C (Re >= 1 for all n whenever z_u = 0)
    (MalkounPathPositivity).
  authors:
    - "Tomasz Tarłowski"
  responsible_maintainers:
    - "Tomasz Tarłowski"
  license: "Apache-2.0"
  repository_url: "https://github.com/tomasztarlowski/malkoun-conjectures-counterexamples"

classification:
  arxiv: ["math-ph", "math.MG", "math.CO", "cs.LO"]
  msc2020: ["05C50", "51M15", "81Q70", "68V20"]

sources:
  - title: "Counterexamples to All Four Malkoun Conjectures A–D, Planar Tree Zeros, and Unconditional Path Positivity"
    authors:
      - "Tomasz Tarłowski"
    id: "https://github.com/tomasztarlowski/malkoun-conjectures-counterexamples/blob/main/paper/malkoun_counterexamples.pdf"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Companion 9-page preprint by the author documenting all formalized counterexamples (B_8, H_7,
      M_8, C_6, C_{12}, T_{10}, LG_{15}), unconditional path positivity for LG_n, and 50-digit
      mpmath witnesses across higher-connectivity graphs, bipartite even cycles C_{18}–C_{28}, and
      exhaustive trees on 4 <= n <= 10 vertices. Archived with permanent Zenodo DOI
      https://doi.org/10.5281/zenodo.24443725.
    author_endorsement: "participated"
  - title: "Finite graphs and configurations of points"
    authors:
      - "Joseph Malkoun"
    id: "arXiv:2508.13472"
    type: "paper"
    relationship: "disproves"
    note: >-
      Original source posing Conjectures A, B, C, D and Section 6 (arXiv:2508.13472v3, Sept 7,
      2026), proving Theorem 4.1 (tree Gram reduction) and Theorem 4.4 (LG_5 positivity). All
      four conjectures (A–D) and Section 6 are formally refuted here; Theorem 4.1 is extended to
      all bipartite graphs and Theorem 4.4 / arbitrary-n Path Conjecture B are proved cleanly.
    author_endorsement: "not-contacted"
  - title: "Proofs of some conjectures on permanents"
    authors:
      - "Elliott H. Lieb"
    type: "paper"
    location: "Journal of Mathematics and Mechanics 16 (1966), 127–134"
    relationship: "background"
    note: >-
      Cited for permanent dominance on positive semidefinite Hermitian correlation matrices
      giving A_{K_{1,m}}(x) = perm(H) >= 1 for star trees.
    author_endorsement: "not-contacted"

status:
  scope: >-
    Formalized unconditionally: disproofs of Conjectures A, B, C, D (general, rank-2, and tree-
    restricted), and Section 6 across general connected, biconnected, triangle-free cubic
    3-connected, tree, and path classes; extension of Theorem 4.1 to all bipartite graphs;
    Conjecture C for LG_3, LG_4, K_{1,3}, LG_5; and Path Conjecture B / Planar Path Conjecture C
    for all n. Analytic classification of non-star trees on 6 <= n <= 9 vertices remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

