status:
  scope: >-
    Formalized unconditionally in Challenge.lean / Solution.lean (12 compared declarations):
    general disproofs of Conjectures A, B, Section 6, General D, Rank-2 D, and Conjecture C
    (implemented via B_8, rank-3 matrix on C_6, rank-2 matrix on C_{12}, and cherryTree10);
    witness-pinned planar disproofs on explicit k4e2k3Graph (Fin 7, H_7), wagnerGraph (Fin 8,
    M_8), and cherryTree10 (Fin 10, T_{10}); exact negative rational real part on explicit
    pathGraphN 15 (Fin 15, LG_{15}); and unconditional Path Conjecture B and Planar Path
    Conjecture C for all n. Additional theorems in Matematyka/ formalize the general bipartite
    reduction and Conjecture C for LG_3, LG_4, K_{1,3}, LG_5. Topological graph planarity of H_7,
    vertex-transitivity of M_8, empirical minimality observations from numerical scans (n <= 6
    connected graphs and 4 <= n <= 9 trees), and 50-digit mpmath companion witnesses lie outside
    the formal Lean statements; analytic classification of non-star trees on 6 <= n <= 9 remains
    open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      framework: "Google Antigravity"
      models:
        - "Gemini (author-directed mathematical exploration, Python/mpmath search, Lean 4 proof engineering, documentation)"
        - "Claude & OpenAI Codex (author-directed sanity checking of proof strategies, statements, and exposition during development)"
      tool_setup: >-
        50-digit arbitrary-precision optimization and witness discovery via Python/mpmath/SciPy
        (scripts/*.py), formalized and kernel-verified in Lean 4 v4.35.0 against Mathlib v4.35.0.
      prompting_notes: "Author-directed development and checking; all formal proofs verified by Lean 4 kernel and #print axioms."
  notes: >-
    All AI usage consisted of author-directed exploration, Lean 4 proof engineering, sanity
    checking, and manuscript drafting; no separate external review was performed outside the
    author's own checking and local kernel verification.

