version: "v0.4"

project:
  name: "Counterexamples to All Four Malkoun Conjectures (A–D), Planar Tree Zeros, and Unconditional Path Positivity"
  description: >-
    Lean 4 and Mathlib formalization resolving all four main conjectures (A, B, C, D) and the
    Section 6 real-positivity question from Joseph Malkoun's preprint "Finite graphs and
    configurations of points" (arXiv:2508.13472v3), alongside unconditional positive theorems for
    linear paths LG_n and small trees. Using strictly propext, Quot.sound, and Classical.choice
    (zero sorry, zero admit, zero native_decide), the repository formalizes: (1) a bipartite
    quaternionic time-reversal Gram reduction extending Malkoun's Theorem 4.1 to all finite simple
    bipartite graphs (MalkounBipartite); (2) formal planar homotopy disproofs of Conjectures A, B,
    and Section 6 on the connected K_4-barbell B_8 (MalkounCounterexample), the 7-vertex
    2-vertex-connected graph H_7 = K_4 ∪_{2e} K_3 (k4e2k3Graph in MalkounN7Counterexample;
    smallest counterexample found in our numerical scan — absence of connected counterexamples on
    n <= 6 vertices is an empirical numerical-search observation, not formally proved), and the
    8-vertex triangle-free 3-regular 3-vertex-connected Wagner graph M_8 (wagnerGraph in
    MalkounWagnerCounterexample); (3) refutations of General Conjecture D at m=6 (rank-3 matrix
    on C_6) and Rank-2 Spinor Conjecture D at m=12 (2x12 Gaussian-integer witness on C_{12})
    alongside unconditional Conjecture C for LG_3, LG_4, K_{1,3}, and LG_5 (MalkounConjectureD);
    (4) an exact planar 120-degree pinwheel zero A_{T_{10}}(x) = 0 on the 10-vertex cubic cherry
    tree T_{10} (cherryTree10 in MalkounConjectureC) refuting Conjecture C, tree-restricted
    Conjecture D, and planar tree Conjectures A and B simultaneously (absence of tree violations on
    4 <= n <= 9 vertices is likewise a numerical search observation, not formally proved), plus
    exact integer Hopf coordinates on the 15-vertex path graph pathGraphN 15 (LG_{15}) giving
    Re(A_{LG_{15}}) = -40605770611892600000 / 58001564658819600000 < 0; and (5) unconditional Path
    Conjectures B and A (|A_{LG_n}(x)| >= 1 for all n and x in C_{LG_n}(R^3)) via an exact
    hyperbolic SU(2) Lyapunov transfer invariant, together with unconditional Planar Path Conjecture C
    (Re >= 1 for all n whenever z_u = 0) (MalkounPathPositivity). Across the 12 compared
    declarations in Challenge.lean, six state pure existential or negative refutations whose
    witnesses (B_8, C_6, C_{12}, T_{10}) reside inside Solution.lean/Matematyka/, four explicitly
    bind the witnesses k4e2k3Graph (Fin 7), wagnerGraph (Fin 8), cherryTree10 (Fin 10), and
    pathGraphN 15 (Fin 15) along with coplanarity (x.1 u 2 = 0) where advertised, and two prove
    unconditional path positivity for all n. Topological graph planarity of H_7, vertex-transitivity
    of M_8, and 50-digit mpmath companion scans lie outside the formal Lean theorems.
  authors:
    - "Tomasz Tarłowski"
  responsible_maintainers:
    - "Tomasz Tarłowski"
  license: "Apache-2.0"
  repository_url: "https://github.com/tomasztarlowski/malkoun-conjectures-counterexamples"

classification:
